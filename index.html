<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VinhChungSuc - Tool Auto Liên Quân</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#e53e3e',
              purple: '#805ad5',
              darkBg: '#121212',
              darkCard: '#1e1e1e',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-zinc-950 dark:text-gray-100 min-h-screen transition-colors duration-200">

  <!-- Header Section -->
  <header class="bg-white dark:bg-zinc-900 shadow-sm sticky top-0 z-40 border-b dark:border-zinc-800">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <!-- Left Controls: Close & Logo -->
      <div class="flex items-center space-x-3">
        <button class="p-2 text-red-500 hover:bg-gray-100 dark:hover:bg-zinc-800 rounded-lg">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
        <!-- Logo Badge -->
        <div class="bg-gradient-to-r from-amber-600 via-yellow-500 to-amber-700 p-1 rounded-lg text-black font-extrabold text-xs tracking-wider uppercase border border-amber-300 shadow">
          VINHCHUNGSUC.COM
          <div class="text-[9px] font-normal text-center lowercase -mt-1 text-black/80">tool auto chung sức liên quân</div>
        </div>
      </div>

      <!-- Right Controls: Theme Toggle & Login Button -->
      <div class="flex items-center space-x-2">
        <button id="themeToggle" class="p-2 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-zinc-800">
          <i id="themeIcon" class="fa-regular fa-moon text-lg"></i>
        </button>
        <button onclick="openModal('authModal')" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center shadow-md">
          <i class="fa-solid fa-right-to-bracket mr-1.5"></i> Đăng nhập
        </button>
      </div>
    </div>
  </header>

  <!-- Main App Container (Mobile Width Focused) -->
  <main class="max-w-md mx-auto px-4 py-4 space-y-4">

    <!-- Auth Action Card -->
    <div class="bg-white dark:bg-zinc-900 rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-zinc-800 text-center">
      <p class="text-xs text-gray-500 dark:text-gray-400 mb-3 font-medium">Đăng nhập tài khoản để xem số dư và nạp ATM</p>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="openModal('authModal')" class="bg-red-500 hover:bg-red-600 text-white py-2.5 rounded-xl font-semibold text-sm shadow-sm flex items-center justify-center">
          <i class="fa-solid fa-right-to-bracket mr-1.5"></i> Đăng nhập
        </button>
        <button onclick="openModal('authModal')" class="bg-gray-100 dark:bg-zinc-800 text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-zinc-700 py-2.5 rounded-xl font-semibold text-sm">
          Đăng ký
        </button>
      </div>
    </div>

    <!-- Main Navigation Menu -->
    <div class="bg-white dark:bg-zinc-900 rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-zinc-800">
      <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Menu chính</h2>
      
      <div class="space-y-1">
        <!-- Menu Item: Trang chủ -->
        <a href="#" class="flex items-center justify-between p-3 rounded-xl hover:bg-gray-50 dark:hover:bg-zinc-800/60 transition">
          <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-red-100 dark:bg-red-900/30 text-red-500 flex items-center justify-center">
              <i class="fa-solid fa-house"></i>
            </div>
            <span class="font-medium text-sm">Trang chủ</span>
          </div>
          <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
        </a>

        <!-- Menu Item: Giao diện Tool -->
        <a href="#" class="flex items-center justify-between p-3 rounded-xl bg-purple-50 dark:bg-purple-950/30 border border-purple-100 dark:border-purple-900/40">
          <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-purple-500 text-white flex items-center justify-center">
              <i class="fa-solid fa-robot"></i>
            </div>
            <span class="font-semibold text-sm text-purple-700 dark:text-purple-300">Giao diện Tool</span>
          </div>
