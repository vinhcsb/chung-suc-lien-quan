<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Chung Sức Liên Quân</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #1a1a1a; color: #fff; }
        .container { max-width: 500px; margin: 0 auto; background: #2a2a2a; padding: 20px; border-radius: 8px; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Quản lý đơn Chung Sức</h2>
        <form id="orderForm">
            <label>Nhập link hoặc mã Chung Sức:</label>
            <input type="text" id="eventUrl" placeholder="https://chungsuc.lienquan.garena.vn/..." required>
            <button type="submit">Tạo đơn hỗ trợ</button>
        </form>
        <div id="result" style="margin-top:15px;"></div>
    </div>
</body>
</html>
